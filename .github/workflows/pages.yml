# Публикация сайта на GitHub Pages.
#
# Корень сайта это папка content/, а не корень репозитория: рядом лежат
# скрипты сборки, исходники кадров и документы, которым в вебе делать нечего.
# Причём внутри content/ такие папки тоже есть, поэтому публикуется не она
# сама, а собранная из неё _site без docs, scripts и share. Подробнее в шаге
# сборки ниже.
#
# Сборку кадров и страниц workflow НЕ запускает намеренно. Кадры генерируются
# около двадцати минут через внешний сервис, и падение этого сервиса не должно
# ронять публикацию. В репозиторий кладутся уже готовые файлы.
name: Публикация на Pages

on:
  push:
    branches: [master]
    # Правка одних только заметок сайт не меняет: страницы это HTML, а
    # markdown тут — карта состояния и списки вопросов. С тех пор как docs/
    # исключён из публикации, оговорка про устаревшие копии на сайте отпала:
    # их там больше нет.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# страницу выкатываем по одной за раз, но очередь не рвём:
# отменённый на середине деплой оставляет сайт в непонятном состоянии
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать папку публикации без внутренних файлов
        # Раньше content/ уезжал в артефакт целиком, и вместе с сайтом
        # публиковались три вещи, которым в вебе делать нечего:
        #
        # docs/    — рабочие заметки. TODO-EGOR.md это список того, чего у
        #            консультанта нет. Он читался по прямой ссылке, а meta
        #            robots в markdown не поставить.
        # scripts/ — исходники сборки со всеми комментариями.
        # share/   — превью на 1.2 МБ с ТЕМ ЖЕ title, что у главной, и без
        #            noindex. После запуска это был бы точный дубль главной
        #            в индексе, конкурирующий с настоящей страницей.
        #
        # Ни одна страница сайта на эти папки не ссылается, проверено.
        run: |
          rm -rf _site
          cp -r content _site
          rm -rf _site/docs _site/scripts _site/share _site/.claude
          find _site -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "В публикацию уходит:"
          ls -A _site

      - name: Проверить согласованность страниц
        # Раньше здесь стояло жёсткое «на каждой странице обязан быть noindex».
        # Это защищало ровно до дня запуска, а в день запуска само бы и упало.
        # Теперь проверяется не режим, а СОГЛАСОВАННОСТЬ: закрыт так закрыт
        # везде, открыт так открыт везде. Половина закрытого сайта хуже обеих
        # половин, а найти такую половину глазами по пяти файлам нельзя.
        #
        # Заодно ловится страница без canonical: дефект тихий, страница
        # выглядит целой, а поисковик схлопывает её с соседней.
        run: |
          # Проверяем ТО, ЧТО ПУБЛИКУЕТСЯ, а не исходники. Прошлая проверка
          # смотрела content/*.html и вложенные папки не видела вовсе: превью
          # в share/ без noindex она пропускала молча.
          nested=$(find _site -mindepth 2 -name '*.html' | head -5)
          if [ -n "$nested" ]; then
            echo "ОШИБКА: HTML во вложенной папке публикации, проверкой не покрыт:"
            echo "$nested"
            exit 1
          fi
          leaked=$(find _site \( -name '*.md' -o -name '*.py' \) | head -5)
          if [ -n "$leaked" ]; then
            echo "ОШИБКА: внутренние файлы попали в публикацию:"
            echo "$leaked"
            exit 1
          fi
          closed=0
          open=0
          for f in _site/*.html; do
            if grep -q 'name="robots" content="noindex' "$f"; then
              closed=$((closed+1))
            else
              open=$((open+1))
              echo "открыта для индексации: $f"
            fi
            if ! grep -q 'rel="canonical"' "$f"; then
              echo "ОШИБКА: нет canonical в $f"
              exit 1
            fi
          done
          if [ "$closed" != "0" ] && [ "$open" != "0" ]; then
            echo "ОШИБКА: сайт закрыт наполовину ($closed закрыто, $open открыто)."
            echo "Причина почти всегда одна: правили тег руками вместо"
            echo "переключателя PUBLISHED в content/scripts/siteinfo.py."
            exit 1
          fi
          if [ "$open" != "0" ]; then
            if grep -q 'Disallow: /' _site/robots.txt; then
              echo "ОШИБКА: страницы открыты, а robots.txt всё ещё закрывает сайт."
              echo "Прогоните content/scripts/build-seo.py."
              exit 1
            fi
            if [ ! -f _site/sitemap.xml ]; then
              echo "ОШИБКА: сайт открыт, а карты сайта нет."
              echo "Прогоните content/scripts/build-seo.py."
              exit 1
            fi
            echo "Сайт открыт для поисковиков, карта и robots на месте."
          else
            echo "Все $closed страниц закрыты от поисковиков."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
